.pitch{color:var(--muted);margin:.9rem 0 1.4rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;font:600 1.15rem Heebo,Arial,sans-serif;text-decoration:none;border-radius:2rem;padding:.95rem;min-height:3.25rem;margin-bottom:.75rem}
.wa{background:var(--wa);color:#0B2E17}
.wa:hover{background:var(--wa-d)}
.wa svg{width:1.5rem;height:1.5rem;flex:none}
.alt{background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
.alt:hover{background:var(--sky)}
.small{font-size:.95rem;margin:1rem 0 0}
.small a{color:var(--ink);font-weight:600}
a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
footer{text-align:center;font-size:.85rem;color:var(--muted);margin-top:1.2rem}
footer a{color:inherit}
